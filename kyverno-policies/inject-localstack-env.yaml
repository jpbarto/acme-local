apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-localstack-env
  annotations:
    policies.kyverno.io/title: Inject LocalStack Environment Variables
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Injects AWS_ENDPOINT_URL into every container so that pods can reach
      LocalStack without any application-level configuration.
spec:
  background: false
  rules:
    - name: inject-aws-endpoint-url
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{request.operation || 'BACKGROUND'}}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE
      context:
        - name: localstackConfig
          configMap:
            name: localstack-config
            namespace: "{{request.namespace}}"
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                env:
                  - name: AWS_ENDPOINT_URL
                    value: "{{ localstackConfig.data.AWS_ENDPOINT_URL }}"
